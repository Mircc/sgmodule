name: Merge AIGC Rules

on:
  schedule:
    - cron: "30 21 * * *"   # UTC 21:30 = 北京时间每天 05:30
  workflow_dispatch:          # 支持手动触发

permissions:
  contents: write             # 允许提交回仓库

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install mihomo (mrs 转换用)
        run: |
          curl -sL -o /tmp/mihomo.gz "https://github.com/MetaCubeX/mihomo/releases/download/v1.19.30/mihomo-linux-amd64-v1.19.30.gz"
          gunzip -f /tmp/mihomo.gz
          sudo install -m 755 /tmp/mihomo /usr/local/bin/mihomo
          mihomo version 2>/dev/null | head -1 || true

      - name: Merge & dedupe rules
        run: |
          python AI-Rules/scripts/merge_aigc_rules.py \
            --sources-file AI-Rules/sources.txt \
            -o AI-Rules/output/ \
            --name Ai \
            --cumulative

      - name: Generate README with links
        run: |
          REPO="${GITHUB_REPOSITORY}"
          BRANCH="${GITHUB_REF_NAME:-main}"
          base_raw="https://raw.githubusercontent.com/${REPO}/${BRANCH}/AI-Rules"
          base_cdn="https://cdn.jsdelivr.net/gh/${REPO}@${BRANCH}/AI-Rules"
          {
            echo "# AI-Rules"
            echo
            echo "> 本文件由 GitHub Actions 自动生成, 订阅链接随仓库/分支自动适配."
            echo
            echo "每日自动拉取上游源, 去重、归类、累积合并 (上游删除不影响本库)."
            echo
            echo "## 客户端一"
            echo
            echo "| 类型 | 链接 |"
            echo "| --- | --- |"
            echo "| 加速链接 (推荐) | ${base_cdn}/output/Cl_Ai.yaml |"
            echo "| 直连备用 | ${base_raw}/output/Cl_Ai.yaml |"
            echo "| mrs 域名 (省电) | ${base_cdn}/output/Cl_Ai_domain.mrs |"
            echo "| mrs IP (省电) | ${base_cdn}/output/Cl_Ai_ipcidr.mrs |"
            echo
            echo "mrs 为二进制规则集 (Clash Meta/mihomo 内核), 手机端更省电, 需配合 \`behavior: domain\` / \`behavior: ipcidr\` 两个 rule-provider 使用:"
            echo
            echo '```yaml'
            echo "rule-providers:"
            echo "  ai-domain:"
            echo "    type: http"
            echo "    behavior: domain"
            echo "    format: mrs"
            echo "    url: ${base_cdn}/output/Cl_Ai_domain.mrs"
            echo "    interval: 86400"
            echo "  ai-ip:"
            echo "    type: http"
            echo "    behavior: ipcidr"
            echo "    format: mrs"
            echo "    url: ${base_cdn}/output/Cl_Ai_ipcidr.mrs"
            echo "    interval: 86400"
            echo "rules:"
            echo "  - RULE-SET,ai-domain,AI"
            echo "  - RULE-SET,ai-ip,AI,no-resolve"
            echo '```'
            echo
            echo "mrs 不含 KEYWORD/REGEX/IP-ASN 类规则 (占比极小), 全量覆盖请用 Cl_Ai.yaml."
            echo
            echo "## 客户端二"
            echo
            echo "| 类型 | 链接 |"
            echo "| --- | --- |"
            echo "| 加速链接 (推荐) | ${base_cdn}/output/Sg_Ai.list |"
            echo "| 直连备用 | ${base_raw}/output/Sg_Ai.list |"
            echo
            echo "## 客户端三"
            echo
            echo "| 类型 | 链接 |"
            echo "| --- | --- |"
            echo "| 加速链接 (推荐) | ${base_cdn}/output/Ai_qx.list, tag=Ai, force-policy=你的策略组, enabled=true |"
            echo "| 直连备用 | ${base_raw}/output/Ai_qx.list, tag=Ai, force-policy=你的策略组, enabled=true |"
            echo
            echo "客户端三订阅时请用 force-policy 参数自由指定策略组 (规则不写策略位, 不预设任何策略)."
            echo
            echo "## 缓存说明"
            echo
            echo "- jsDelivr 分支缓存约 12 小时, 急更新访问 https://purge.jsdelivr.net 刷新"
            echo "- 个别地区可换 testingcf.jsdelivr.net / fastly.jsdelivr.net 同源镜像, 路径不变"
          } > AI-Rules/README.md

      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AI-Rules/output/ AI-Rules/README.md
          if git diff --staged --quiet; then
            echo "规则无变化, 跳过提交"
          else
            git commit -m "auto: merge AIGC rules $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi

      - name: Purge jsDelivr cache
        run: |
          REPO="${GITHUB_REPOSITORY}"
          BRANCH="${GITHUB_REF_NAME:-main}"
          for f in output/Cl_Ai.yaml output/Sg_Ai.list output/Ai_qx.list \
                   output/Cl_Ai_domain.mrs output/Cl_Ai_ipcidr.mrs README.md; do
            echo "purge: ${f}"
            curl -sL --max-time 30 "https://purge.jsdelivr.net/gh/${REPO}@${BRANCH}/AI-Rules/${f}" \
              | head -c 200 || true
            echo
          done
